<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1f1c" />
  <meta name="description" content="Digital business card — tap to connect" />
  <title>Client Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="card-page">
    <header class="identity">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" src="" alt="Profile photo" />
        <span class="avatar-ring"></span>
      </div>
      <p class="brand-mark" id="brandMark">NFC Card</p>
      <h1 id="fullName">Client Name</h1>
      <p class="role" id="jobTitle">Job Title</p>
      <p class="company" id="company">Company</p>
      <p class="bio" id="bio"></p>
    </header>

    <section class="actions" aria-label="Quick actions">
      <a id="callBtn" class="btn btn-primary" href="tel:">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
        Call Now
      </a>
      <button type="button" id="saveBtn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-1 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V4.5L19.5 9H13z"/></svg>
        Save Contact
      </button>
    </section>

    <section class="details" aria-label="Contact details">
      <a id="phoneLink" class="detail" href="tel:">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
        </span>
        <span>
          <small>Phone</small>
          <strong id="phoneText"></strong>
        </span>
      </a>
      <a id="emailLink" class="detail" href="mailto:">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </span>
        <span>
          <small>Email</small>
          <strong id="emailText"></strong>
        </span>
      </a>
      <a id="websiteLink" class="detail" href="#" target="_blank" rel="noopener noreferrer">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.9 9h-3.2a15.4 15.4 0 0 0-1.3-5.3A8 8 0 0 1 19.9 11zM12 4c.8 0 2.3 1.9 3 5H9c.7-3.1 2.2-5 3-5zM4.1 13h3.2c.2 1.9.7 3.7 1.3 5.3A8 8 0 0 1 4.1 13zm3.2-2H4.1a8 8 0 0 1 4.5-5.3A15.4 15.4 0 0 0 7.3 11zM12 20c-.8 0-2.3-1.9-3-5h6c-.7 3.1-2.2 5-3 5zm1.5-7h-3c.2-1.9.7-3.7 1.5-5.2.8 1.5 1.3 3.3 1.5 5.2zm2.2 5.3c.6-1.6 1.1-3.4 1.3-5.3h3.2a8 8 0 0 1-4.5 5.3z"/></svg>
        </span>
        <span>
          <small>Website</small>
          <strong id="websiteText"></strong>
        </span>
      </a>
      <div id="addressBlock" class="detail detail-static">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
        </span>
        <span>
          <small>Location</small>
          <strong id="addressText"></strong>
        </span>
      </div>
    </section>

    <section class="socials" aria-label="Social media">
      <h2>Connect</h2>
      <div id="socialList" class="social-list"></div>
    </section>

    <footer class="footer">
      <p>Powered by <span id="productName">TapCard</span></p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
